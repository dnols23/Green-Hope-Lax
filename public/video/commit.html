<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!--HF:BASE-->
    <script src="assets/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/kit.css" />
    <!--HF:FIELDS-->
    <style>
      #stamp { top: 250px; font-size: 200px; }
      #card { position: absolute; left: 230px; top: 520px; width: 620px; height: 680px; border-radius: 28px; overflow: hidden;
        border: 6px solid #1f8a5c; box-shadow: 0 0 80px rgba(79, 208, 150, 0.35); background: #04140d; }
      #card img.p { width: 100%; height: 100%; object-fit: cover; }
      #card img.logo { position: absolute; left: 40px; top: 150px; width: 540px; }
      #name { top: 1240px; font-size: 130px; }
      #detail { top: 1395px; font-size: 34px; letter-spacing: 0.22em; color: #9aa6a0; }
      #to { top: 1460px; font-size: 32px; letter-spacing: 0.5em; color: #c3ccc7; }
      #college { top: 1510px; font-size: 104px; }
      #handle { top: 1660px; }
      .bit { position: absolute; top: -60px; width: 18px; height: 30px; border-radius: 3px; }
      #black { position: absolute; inset: 0; background: #000; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <!--HF:AUDIO-->
      <div class="haze"></div>
      <img class="wm l" src="assets/falcon-head.png" alt="" />
      <img class="wm r" src="assets/falcon-head.png" alt="" />
      <div id="beam" class="beam"></div>
      <div class="vignette"></div>
      <div id="confetti" class="fill"></div>
      <div id="scene" class="fill clip" data-start="0" data-duration="10" data-track-index="0">
        <div id="stamp" class="row anton chrome"><span>Committed</span></div>
        <div id="card">
          <img class="p" src="{{photo:photo}}" alt="" data-if="photo" />
          <img class="logo" src="assets/falcon-head.png" alt="" data-unless="photo" />
        </div>
        <div id="name" class="row anton"><span data-field="name" data-fit="960"></span></div>
        <div id="detail" class="row caps" data-if="detail"><span data-field="detail" data-fit="940"></span></div>
        <div id="to" class="row caps"><span>to play at</span></div>
        <div id="college" class="row anton green"><span data-field="college" data-fit="960"></span></div>
        <div id="handle" class="row caps handle"><span data-field="handle"></span></div>
      </div>
      <div id="black"></div>
    </div>
    <script src="assets/kit.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#stamp', { opacity: 0, scale: 2.2, filter: 'blur(16px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.45, ease: 'power4.in' }, 0.2)
        .fromTo('#stamp', { x: 0 }, { x: 14, duration: 0.05, ease: 'none', repeat: 5, yoyo: true, immediateRender: false }, 0.65)
        .fromTo('#beam', { backgroundPosition: '100% 0' }, { backgroundPosition: '0% 0', duration: 1.0, ease: 'power2.inOut' }, 0.6)
        .fromTo('#card', { opacity: 0, y: 120, rotation: -4 }, { opacity: 1, y: 0, rotation: -2, duration: 0.9, ease: 'power3.out' }, 1.0)
        .fromTo('#name', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 1.9)
        .fromTo('#detail', { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'sine.out' }, 2.3)
        .fromTo('#to', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'sine.out' }, 2.8)
        .fromTo('#college', { opacity: 0, scale: 1.3, filter: 'blur(12px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.65, ease: 'expo.out' }, 3.1)
        .fromTo('#handle', { opacity: 0 }, { opacity: 1, duration: 0.8, ease: 'sine.out' }, 4.6)
        .fromTo('#beam', { backgroundPosition: '100% 0' }, { backgroundPosition: '0% 0', duration: 1.2, ease: 'power2.inOut', immediateRender: false }, 5.6)
        .to('#black', { opacity: 1, duration: 0.6, ease: 'power2.in' }, 9.4);

      // Green, white and silver confetti when the college lands.
      const rnd = HF.rand(2027);
      const colors = ['#1f8a5c', '#4fd096', '#f5f5f4', '#a7aeb4'];
      const box = document.getElementById('confetti');
      for (let i = 0; i < 46; i++) {
        const b = document.createElement('div');
        b.className = 'bit';
        b.style.left = Math.round(rnd() * 1060) + 'px';
        b.style.background = colors[i % colors.length];
        box.appendChild(b);
        const fall = 4 + rnd() * 3;
        tl.fromTo(b, { y: 0, rotation: rnd() * 180, opacity: 1 },
          { y: 1900 + rnd() * 300, x: (rnd() - 0.5) * 300, rotation: 360 + rnd() * 540, duration: fall, ease: 'none' }, 3.15 + rnd() * 0.9);
      }
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
